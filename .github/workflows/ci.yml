name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build and start services
        run: |
          docker compose build
          docker compose up -d

      - name: Show running containers
        run: docker compose ps -a

      - name: Wait for db
        run: |
          echo "Waiting for db..."
          for i in $(seq 1 30); do
            if docker compose exec -T db pg_isready -U postgres 2>/dev/null; then
              echo "db is ready"
              break
            fi
            echo "db not ready... ($i)"
            sleep 3
          done

      - name: Wait for redis
        run: |
          echo "Waiting for redis..."
          for i in $(seq 1 20); do
            if docker compose exec -T redis redis-cli ping 2>/dev/null | grep -q PONG; then
              echo "redis is ready"
              break
            fi
            echo "redis not ready... ($i)"
            sleep 3
          done

      - name: Run migrations
        run: docker compose exec -T web python manage.py migrate

      - name: Collect static
        run: docker compose exec -T web python manage.py collectstatic --noinput

      - name: Wait for app
        run: |
          echo "Waiting for app on port 80..."
          for i in $(seq 1 30); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:80/ 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "302" ]; then
              echo "App is ready (HTTP $HTTP_CODE)"
              exit 0
            fi
            echo "Waiting... attempt $i (got $HTTP_CODE)"
            sleep 5
          done
          echo "App failed to start"
          docker compose logs web
          exit 1

      - name: Test startpage
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:80/)
          echo "Startpage returned HTTP $HTTP_CODE"
          [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "302" ]

      - name: Logs on failure
        if: failure()
        run: docker compose logs

      - name: Cleanup
        if: always()
        run: docker compose down
