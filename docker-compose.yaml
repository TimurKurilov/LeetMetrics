version: '3.9'

services:
  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
  celery:
    build: .
    image: celery:latest
    container_name: celery
    restart: always
    command: celery -A LeetMetrics worker --loglevel=info
    environment:
      - DJANGO_SETTINGS_MODULE=LeetMetrics.settings
    volumes:
      - static_value:/app/static/
      - media_value:/app/media/
    env_file:
      - ./.env
    depends_on:
      redis:
        condition: service_healthy
  db:
    image: postgres:15.0-alpine
    volumes:
      - /var/lib/postgresql/data/
    env_file:
      - ./.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leetmetrics_user -d leetmetrics_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build: .
    image: web:latest
    container_name: web
    restart: always
    environment:
      - DJANGO_SETTINGS_MODULE=LeetMetrics.settings
    volumes:
      - static_value:/app/static/
      - media_value:/app/media/
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_value:/var/html/static/
      - media_value:/var/html/media/
    depends_on:
      - web


volumes:
  static_value:
  media_value:
